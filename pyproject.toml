[project]
name = "stapy-shop-mcp-demo"
version = "1.0.0"
description = "stapy商店：人間UI / MCP / MCP Apps / WebMCP の4方式比較デモ"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.7",
    "mcp==2.3.0",
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "playwright==1.60.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
