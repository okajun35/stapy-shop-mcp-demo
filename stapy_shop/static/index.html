<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="stapy商店：Start Python Clubを題材にした非公式の架空ECデモ。20種類の架空グッズを検索・比較できます。">
<title>商品一覧 | stapy商店 — ECデモ</title>
<link rel="stylesheet" href="/static/styles.css">
<script src="/static/shop.js" defer></script>
<script src="/static/webmcp.js" defer></script>
</head>
<body data-page="catalog">
<div id="site-header"></div>
<div id="hero"></div>
<main class="catalog-layout" id="main">
 <aside class="filters" aria-label="商品フィルター">
  <div class="filters-heading">▱ 商品を絞り込む <button type="button" id="reset-filters" class="text-action">クリア</button></div>
  <section class="filter-section"><h2>カテゴリ</h2><div id="category-filters" class="filter-options"></div></section>
  <section class="filter-section"><h2>価格</h2><input type="range" id="price-filter" value="10000" min="0" max="10000" step="100" aria-label="価格上限"><div class="price-fields"><span>¥0</span><output id="price-current">¥10,000</output></div></section>
  <section class="filter-section"><h2>在庫</h2><label class="checkline"><input type="checkbox" id="stock-filter" checked><span>在庫ありのみ表示</span></label></section>
  <section class="filter-section"><h2>特集</h2><label class="checkline"><input type="checkbox" id="featured-filter"><span>おすすめ・人気商品のみ</span></label></section>
  <p class="filter-footnote">商品・金額・在庫はすべてデモ用の架空データです。</p>
 </aside>
 <section class="catalog-content" aria-labelledby="catalog-title">
  <div class="catalog-toolbar"><div><h1 id="catalog-title">商品一覧 <span id="results-count">（全20件）</span><span class="title-squiggle">〰</span></h1><p class="catalog-lede">Pythonコミュニティの「好き」を、グッズに。</p></div><div class="sort-wrap"><label for="sort-products">並び替え</label><select id="sort-products"><option value="recommended">おすすめ順</option><option value="price-asc">価格が安い順</option><option value="price-desc">価格が高い順</option><option value="name">商品名順</option></select></div></div>
  <div id="product-grid" class="product-grid" aria-live="polite"></div>
  <div id="empty-results" class="empty-results" hidden><h2>該当する商品がありません</h2><p>検索語や絞り込み条件を変更してください。</p><button class="button button-primary" id="empty-reset">すべての商品を見る</button></div>
 </section>
</main>
<div id="site-footer"></div>
<div id="cart-root"></div>
<div id="toast-region" class="toast-region" aria-live="polite"></div>
</body>
</html>
